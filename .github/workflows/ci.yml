name: ci

on:
  push:
  pull_request:

# The git repo root is one level above the monorepo, which lives in
# session-brief/. Every job runs there.
defaults:
  run:
    working-directory: session-brief

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: session-brief/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm check

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session-brief/apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  contracts:
    # Regenerate both bindings and fail if the committed output drifted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:gen
      - name: Fail if generated contracts are stale
        run: git diff --exit-code
