[project]
name = "worker"
version = "0.0.0"
description = "Session Brief pipeline: ingest, compute, assemble, send."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "apscheduler>=3.11",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "anthropic>=0.40",
    "exchange-calendars>=4.13.2",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "datamodel-code-generator>=0.26",
    # Validates stored bodies against the canonical JSON Schema directly, rather
    # than only through the generated Pydantic models (see test_contract_schema).
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by datamodel-codegen from the JSON Schema; its line lengths track the
# schema's field descriptions, not our style. The schema is the source of truth.
extend-exclude = ["contracts/brief.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The local alembic/ dir makes ruff mistake the third-party package for first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["worker", "worker_cn", "tests"]

# Generated bindings are not hand-maintained; don't hold them to strict typing.
[[tool.mypy.overrides]]
module = ["contracts.*"]
ignore_errors = true

# Third-party without type stubs (M10 scheduler): the trading calendar and APScheduler.
[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
