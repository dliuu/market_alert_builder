[project]
name = "worker"
version = "0.0.0"
description = "Session Brief pipeline: ingest, compute, assemble, send."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "apscheduler>=3.11",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "datamodel-code-generator>=0.26",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The local alembic/ dir makes ruff mistake the third-party package for first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["worker", "tests"]

# Generated bindings are not hand-maintained; don't hold them to strict typing.
[[tool.mypy.overrides]]
module = ["contracts.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
